name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: dropdown
    id: application
    attributes:
      label: Application
      description: Which application is affected?
      options:
        - Web Application (sentinel-web)
        - Mobile Application (sentinel-guard)
        - Both
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen Recordings
      description: If applicable, add screenshots or screen recordings to help explain your problem.

  - type: dropdown
    id: user-role
    attributes:
      label: User Role
      description: What role were you using when the bug occurred?
      options:
        - Super Admin
        - Class Representative (CR)
        - Girls Representative (GR)
        - Guard
        - Student
        - Not Logged In
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (for web app)
      description: e.g., Chrome 120, Safari 17, Firefox 121
      placeholder: Chrome 120

  - type: input
    id: device
    attributes:
      label: Device (for mobile app)
      description: e.g., iPhone 15, Samsung Galaxy S24, Expo Go
      placeholder: iPhone 15

  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g., macOS 14.2, Windows 11, iOS 17.2, Android 14
      placeholder: macOS 14.2

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please copy and paste any relevant log output. This will be automatically formatted.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues to avoid duplicates
          required: true
        - label: I have provided all the requested information
          required: true
